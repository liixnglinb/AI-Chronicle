<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AI 轨迹">
  <title>AI 轨迹 · 本地工作观测台</title>
  <desc>带有玻璃质感的观测环，高亮弧段与节点代表正在推进的工作轨迹</desc>
  <defs>
    <linearGradient id="tile" x1="16" y1="0" x2="49" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#244d43"/>
      <stop offset="0.42" stop-color="#12352e"/>
      <stop offset="1" stop-color="#061512"/>
    </linearGradient>
    <radialGradient id="tileLight" cx="20" cy="8" r="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8cf9df" stop-opacity="0.18"/>
      <stop offset="0.32" stop-color="#5ed5bd" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#5ed5bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="7" y1="5" x2="56" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c7fff1" stop-opacity="0.42"/>
      <stop offset="0.32" stop-color="#8be5d0" stop-opacity="0.12"/>
      <stop offset="0.7" stop-color="#020c09" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8be5d0" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="arc" x1="32" y1="15" x2="18.1" y2="41.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ce7ca" stop-opacity="0.28"/>
      <stop offset="0.48" stop-color="#5fe0c4" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#a1ffe7"/>
    </linearGradient>
    <linearGradient id="arcEdge" x1="31" y1="14" x2="17" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d0fff5" stop-opacity="0.82"/>
      <stop offset="0.5" stop-color="#a6ffea" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#d8fff8" stop-opacity="0.78"/>
    </linearGradient>
    <radialGradient id="node" cx="29%" cy="22%" r="82%">
      <stop offset="0" stop-color="#d4fff5"/>
      <stop offset="0.18" stop-color="#8df5da"/>
      <stop offset="0.62" stop-color="#38c5a7"/>
      <stop offset="1" stop-color="#087760"/>
    </radialGradient>
    <radialGradient id="core" cx="31%" cy="25%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#e9fff9"/>
      <stop offset="1" stop-color="#a6ebd8"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <clipPath id="tileClip"><rect x="1" y="1" width="62" height="62" rx="13.4"/></clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect width="64" height="64" fill="url(#tile)"/>
    <rect width="64" height="64" fill="url(#tileLight)"/>

    <!-- 内陷轨道：薄而克制，让高亮弧段有材质对比，不增加小尺寸噪点 -->
    <circle cx="32" cy="32" r="17" fill="none" stroke="#010a08" stroke-opacity="0.42" stroke-width="6.6"/>
    <circle cx="32" cy="31.3" r="17" fill="none" stroke="#7ae4cc" stroke-opacity="0.17" stroke-width="3.2"/>

    <!-- 节点光晕只在大尺寸可见，托盘尺寸不会变成一团白 -->
    <circle cx="18.07" cy="41.75" r="7.5" fill="#61e5c7" fill-opacity="0.24" filter="url(#softGlow)"/>
    <path d="M32 15 A17 17 0 1 1 18.07 41.75" fill="none" stroke="#020c09" stroke-opacity="0.6" stroke-width="8.2" stroke-linecap="round" transform="translate(0 1)"/>
    <path d="M32 15 A17 17 0 1 1 18.07 41.75" fill="none" stroke="url(#arc)" stroke-width="7" stroke-linecap="round"/>
    <!-- 上缘极细高光，模拟珐琅/玻璃边缘；透明度低避免 16px 断裂 -->
    <path d="M32 15 A17 17 0 1 1 18.07 41.75" fill="none" stroke="url(#arcEdge)" stroke-width="1.15" stroke-linecap="round" opacity="0.72"/>

    <!-- 轨道终点：有外圈、渐变实体和白色核心，形成层次但不喧宾夺主 -->
    <circle cx="18.07" cy="41.75" r="6.55" fill="#03110d" fill-opacity="0.72"/>
    <circle cx="18.07" cy="41.75" r="5.85" fill="url(#node)"/>
    <circle cx="16.55" cy="40.25" r="1.35" fill="#effffb" fill-opacity="0.84"/>
    <circle cx="18.07" cy="41.75" r="2.25" fill="url(#core)"/>

    <!-- 中心观测点：小范围辉光 + 实体核心 -->
    <circle cx="32" cy="32" r="5.5" fill="#63e5c7" fill-opacity="0.13"/>
    <circle cx="32" cy="32" r="3.9" fill="#08271f" stroke="#7df0d6" stroke-opacity="0.78" stroke-width="1.25"/>
    <circle cx="31.15" cy="31.15" r="1.08" fill="#effffb" fill-opacity="0.9"/>
  </g>

  <!-- 双层外壳：外缘深色压边 + 内缘高光，替代单一硬白描边 -->
  <rect x="0.7" y="0.7" width="62.6" height="62.6" rx="13.7" fill="none" stroke="#020a08" stroke-opacity="0.64" stroke-width="1.5"/>
  <rect x="1.55" y="1.55" width="60.9" height="60.9" rx="12.9" fill="none" stroke="url(#rim)" stroke-width="1.1"/>
</svg>
