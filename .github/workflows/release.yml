name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Generate icons
        run: npm run icon

      - name: Build and publish Windows packages
        shell: pwsh
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 标签名不能直接插值进脚本：git ref 允许出现引号等字符，
          # "${{ github.ref_name }}" 会把脚本字符串截断并执行后半段。走 env 传值。
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag --repo liixnglinb/AI-Chronicle *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo liixnglinb/AI-Chronicle --title "AI 轨迹 $tag" --notes "Windows release $tag" --verify-tag
          }
          gh release upload $tag `
            "release/AI-Chronicle-Setup.exe" `
            "release/AI-Chronicle-Portable.exe" `
            "release/AI-Chronicle-Setup.exe.blockmap" `
            "release/latest.yml" `
            --repo liixnglinb/AI-Chronicle `
            --clobber
